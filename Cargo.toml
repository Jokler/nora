[package]
name = "nora"
description = "Freezes the screen for another program"
version = "0.2.0"
authors = ["Jokler <jokler@protonmail.com>"]
repository = "https://github.com/jokler/nora"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["x11", "screenshot"]
categories = ["command-line-utilities"]
edition = "2018"
build = "build.rs"

[dependencies]
structopt = "0.3.26"
anyhow = "1.0.71"
libc = "0.2.146"
x11 = "2.21.0"

[build-dependencies]
pkg-config = "0.3.27"
